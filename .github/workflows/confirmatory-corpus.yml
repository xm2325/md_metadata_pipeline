name: Prepare confirmatory corpus manifest

on:
  workflow_dispatch:
    inputs:
      max_candidates:
        description: Maximum Europe PMC metadata candidates
        required: false
        default: "500"
      seed:
        description: Deterministic split seed
        required: false
        default: "3997"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Query Europe PMC metadata
        env:
          MAX_CANDIDATES: ${{ inputs.max_candidates }}
        run: |
          python scripts/query_europe_pmc.py \
            --output study/confirmatory_60/generated/candidates.json \
            --max-candidates "$MAX_CANDIDATES"
      - name: Lock deterministic 30/10/20 split
        env:
          SEED: ${{ inputs.seed }}
        run: |
          python scripts/prepare_confirmatory_benchmark.py \
            --candidates study/confirmatory_60/generated/candidates.json \
            --excluded-ids study/confirmatory_60/prior_article_ids.txt \
            --minimum-excluded 30 \
            --seed "$SEED" \
            --output study/confirmatory_60/generated/locked_plan.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: confirmatory-corpus-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: study/confirmatory_60/generated/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
