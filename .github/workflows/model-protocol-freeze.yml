name: Validate model protocol freeze

on:
  pull_request:
    paths:
      - .github/workflows/model-protocol-freeze.yml
      - scripts/freeze_independent_model.py
      - scripts/run_llm_protocol_batch.py
      - scripts/run_model_backed_integration.py
      - src/mdmeta/llm_adapter.py
      - src/mdmeta/llm_batch.py
      - src/mdmeta/model_protocol_freeze.py
      - tests/test_llm_batch.py
      - tests/test_model_backed_integration.py
      - tests/test_model_protocol_freeze.py
      - tests/test_committed_scale80_evidence.py
      - study/independent_100/*.json
      - docs/INDEPENDENT_GOLD_PROTOCOL.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  synthetic-offline-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Lint model-freeze boundary
        run: >-
          ruff check
          scripts/freeze_independent_model.py
          scripts/run_model_backed_integration.py
          src/mdmeta/llm_adapter.py
          src/mdmeta/llm_batch.py
          src/mdmeta/model_protocol_freeze.py
          tests/test_llm_batch.py
          tests/test_model_backed_integration.py
          tests/test_model_protocol_freeze.py
          tests/test_committed_scale80_evidence.py
      - name: Validate only synthetic scale and gold contracts
        run: >-
          pytest -q
          tests/test_llm_batch.py
          tests/test_model_backed_integration.py
          tests/test_model_protocol_freeze.py
          tests/test_committed_scale80_evidence.py
