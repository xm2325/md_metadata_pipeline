name: Live Qwen extraction smoke

on:
  push:
    branches: [agent/qwen-structured-extraction]
    paths:
      - .github/workflows/live-qwen-smoke.yml
      - scripts/run_live_llm_smoke.py
      - scripts/run_compact_llm_probe.py
      - scripts/run_unconstrained_llm_probe.py
      - scripts/run_minimal_llm_probe.py
      - src/mdmeta/llm_adapter.py
      - src/mdmeta/openai_backend.py
  pull_request:
    paths:
      - .github/workflows/live-qwen-smoke.yml
      - scripts/run_live_llm_smoke.py
      - scripts/run_compact_llm_probe.py
      - scripts/run_unconstrained_llm_probe.py
      - scripts/run_minimal_llm_probe.py
      - src/mdmeta/llm_adapter.py
      - src/mdmeta/openai_backend.py
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: live-qwen-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qwen-live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Install official llama.cpp CPU binaries
        run: |
          curl --fail --location --silent --show-error https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v llama
          llama --version

      - name: Start Qwen3.5-0.8B Q8 server
        run: |
          nohup llama server \
            -hf ggerganov/Qwen3.5-0.8B-GGUF:Q8_0 \
            --alias Qwen/Qwen3.5-0.8B \
            --host 127.0.0.1 \
            --port 8081 \
            --ctx-size 8192 \
            --threads 4 \
            --parallel 1 \
            > /tmp/llama-server.log 2>&1 &
          echo $! > /tmp/llama-server.pid
          ready=false
          for attempt in $(seq 1 180); do
            if curl --silent --fail http://127.0.0.1:8081/health > /tmp/health.json; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            cat /tmp/llama-server.log
            exit 1
          fi
          cat /tmp/health.json
          curl --silent --fail http://127.0.0.1:8081/v1/models

      - name: Run minimal positive capability control
        env:
          MDMETA_LLM_BASE_URL: http://127.0.0.1:8081/v1
          MDMETA_LLM_MODEL: Qwen/Qwen3.5-0.8B
        run: |
          mkdir -p results/live_qwen_smoke
          python scripts/run_minimal_llm_probe.py \
            --output results/live_qwen_smoke/minimal_probe.json \
            --markdown results/live_qwen_smoke/pr-comment.md
          cat results/live_qwen_smoke/pr-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish minimal-probe result on PR 31
        if: always() && hashFiles('results/live_qwen_smoke/pr-comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 31 --body-file results/live_qwen_smoke/pr-comment.md

      - name: Show detailed result and server tail
        if: always()
        run: |
          if [ -f results/live_qwen_smoke/minimal_probe.json ]; then
            cat results/live_qwen_smoke/minimal_probe.json
          fi
          echo "--- llama-server tail ---"
          tail -n 200 /tmp/llama-server.log || true

      - name: Upload smoke-test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: live-qwen35-08b-smoke-${{ github.sha }}
          path: results/live_qwen_smoke
          if-no-files-found: warn
          retention-days: 7
