name: Live Qwen extraction smoke

on:
  push:
    branches: [agent/qwen-structured-extraction]
    paths:
      - .github/workflows/live-qwen-smoke.yml
      - scripts/run_live_llm_smoke.py
      - src/mdmeta/llm_adapter.py
      - src/mdmeta/openai_backend.py
  pull_request:
    paths:
      - .github/workflows/live-qwen-smoke.yml
      - scripts/run_live_llm_smoke.py
      - src/mdmeta/llm_adapter.py
      - src/mdmeta/openai_backend.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-qwen-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qwen-live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Install official llama.cpp CPU binaries
        run: |
          curl --fail --location --silent --show-error https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v llama
          llama --version

      - name: Start Qwen3.5-0.8B Q8 server
        run: |
          nohup llama server \
            -hf ggerganov/Qwen3.5-0.8B-GGUF:Q8_0 \
            --alias Qwen/Qwen3.5-0.8B \
            --host 127.0.0.1 \
            --port 8081 \
            --ctx-size 8192 \
            --threads 4 \
            --parallel 1 \
            > /tmp/llama-server.log 2>&1 &
          echo $! > /tmp/llama-server.pid
          ready=false
          for attempt in $(seq 1 180); do
            if curl --silent --fail http://127.0.0.1:8081/health > /tmp/health.json; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            cat /tmp/llama-server.log
            exit 1
          fi
          cat /tmp/health.json
          curl --silent --fail http://127.0.0.1:8081/v1/models

      - name: Run real structured extraction and validator
        env:
          MDMETA_LLM_BASE_URL: http://127.0.0.1:8081/v1
          MDMETA_LLM_MODEL: Qwen/Qwen3.5-0.8B
          MDMETA_LLM_TIMEOUT_SECONDS: "600"
          MDMETA_LLM_MAX_OUTPUT_TOKENS: "450"
          MDMETA_LLM_MAX_RETRIES: "1"
          MDMETA_LLM_RETRY_BACKOFF_SECONDS: "2"
          MDMETA_LLM_DISABLE_THINKING: "false"
          MDMETA_LLM_SEED: "0"
        run: |
          mkdir -p results/live_qwen_smoke
          python scripts/run_live_llm_smoke.py \
            --output results/live_qwen_smoke/qwen35_08b_results.json \
            --summary results/live_qwen_smoke/summary.md
          cat results/live_qwen_smoke/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Show detailed result and server tail
        if: always()
        run: |
          if [ -f results/live_qwen_smoke/qwen35_08b_results.json ]; then
            cat results/live_qwen_smoke/qwen35_08b_results.json
          fi
          echo "--- llama-server tail ---"
          tail -n 200 /tmp/llama-server.log || true

      - name: Upload smoke-test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: live-qwen35-08b-smoke-${{ github.sha }}
          path: results/live_qwen_smoke
          if-no-files-found: warn
          retention-days: 7
