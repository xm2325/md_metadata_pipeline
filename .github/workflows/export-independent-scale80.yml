name: Export independent scale80 manifest

on:
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Accepted independent-100 selection run ID
        required: true
        default: "29457386366"
      upstream_artifact_id:
        description: Accepted corpus-metadata artifact ID
        required: true
        default: "8359895439"
      upstream_artifact_zip_sha256:
        description: Accepted corpus-metadata artifact ZIP SHA-256
        required: true
        default: "bbe45e1f358039ac57d98d51d6af6f82c2cb917d4691b49a1e07aaec9c81b197"
      selection_source_commit:
        description: Source commit that created the accepted selection
        required: true
        default: "5cbbc8d8b16d466054f7132cc8a43d508da74f56"
      accepted_plan_sha256:
        description: Accepted independent-100 frozen plan SHA-256
        required: true
        default: "b31d7fd465134ae7d6b884d5186a15945aa9b53c770b237259d09452a51076f2"
      accepted_audit_sha256:
        description: Accepted independent-100 plan audit SHA-256
        required: true
        default: "29cd70ef9e8d74532b77327eae2dbe8eeb404cd04328f33921fd97d1f4e5a400"
  pull_request:
    paths:
      - .github/workflows/export-independent-scale80.yml
      - scripts/export_independent_scale_manifest.py
      - tests/test_independent_scale_export.py
      - scripts/audit_independent_plan.py
      - scripts/finalize_screened_plan.py
      - src/mdmeta/benchmark.py

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Lint scale-export code
        run: >-
          ruff check
          scripts/export_independent_scale_manifest.py
          tests/test_independent_scale_export.py
      - name: Test scale-export boundary
        run: pytest -q tests/test_independent_scale_export.py

  export-scale80:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Download and verify accepted metadata artifact
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_ARTIFACT_ID: ${{ inputs.upstream_artifact_id }}
          EXPECTED_ZIP_SHA256: ${{ inputs.upstream_artifact_zip_sha256 }}
        run: |
          case "$UPSTREAM_ARTIFACT_ID" in
            ''|*[!0-9]*) echo "invalid artifact ID" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/independent100-upstream"
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$UPSTREAM_ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/independent100-upstream.zip"
          echo "$EXPECTED_ZIP_SHA256  $RUNNER_TEMP/independent100-upstream.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/independent100-upstream.zip" \
            -d "$RUNNER_TEMP/independent100-upstream"
          cd "$RUNNER_TEMP/independent100-upstream"
          sha256sum --check --strict CORPUS_SHA256SUMS.txt
      - name: Export only scale80 and exclude locked-test gold20
        env:
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
          UPSTREAM_ARTIFACT_ID: ${{ inputs.upstream_artifact_id }}
          UPSTREAM_ZIP_SHA256: ${{ inputs.upstream_artifact_zip_sha256 }}
          SELECTION_SOURCE_COMMIT: ${{ inputs.selection_source_commit }}
          ACCEPTED_PLAN_SHA256: ${{ inputs.accepted_plan_sha256 }}
          ACCEPTED_AUDIT_SHA256: ${{ inputs.accepted_audit_sha256 }}
        run: |
          mkdir -p study/independent_100/generated/scale80_export
          python scripts/export_independent_scale_manifest.py \
            --plan "$RUNNER_TEMP/independent100-upstream/frozen_plan.json" \
            --screen "$RUNNER_TEMP/independent100-upstream/fulltext_machine_screen.json" \
            --plan-audit "$RUNNER_TEMP/independent100-upstream/plan_audit.json" \
            --study-context "$RUNNER_TEMP/independent100-upstream/study_context.json" \
            --upstream-run-id "$UPSTREAM_RUN_ID" \
            --upstream-artifact-id "$UPSTREAM_ARTIFACT_ID" \
            --upstream-artifact-zip-sha256 "$UPSTREAM_ZIP_SHA256" \
            --expected-source-commit "$SELECTION_SOURCE_COMMIT" \
            --expected-plan-sha256 "$ACCEPTED_PLAN_SHA256" \
            --expected-audit-sha256 "$ACCEPTED_AUDIT_SHA256" \
            --output-manifest study/independent_100/generated/scale80_export/source_manifest.json \
            --output-audit study/independent_100/generated/scale80_export/export_audit.json
          cd study/independent_100/generated/scale80_export
          sha256sum source_manifest.json export_audit.json > SHA256SUMS.txt
      - name: Delete upstream 80/20 metadata
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/independent100-upstream"
          rm -f "$RUNNER_TEMP/independent100-upstream.zip"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: independent100-scale80-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: study/independent_100/generated/scale80_export/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
