name: Build provisional temporal corpus

on:
  workflow_dispatch:
    inputs:
      max_candidates:
        description: Maximum historical Europe PMC candidates
        required: false
        default: "500"
      seed:
        description: Deterministic pool seed
        required: false
        default: "3997"
      screening_pool_size:
        description: Number of articles to full-text screen before selecting 60
        required: false
        default: "90"
  pull_request:
    paths:
      - .github/workflows/provisional-temporal-corpus.yml
      - scripts/prepare_confirmatory_benchmark.py
      - scripts/query_europe_pmc.py
      - scripts/screen_selected_fulltext.py
      - scripts/finalize_screened_plan.py
      - scripts/build_annotation_workpack.py
      - scripts/build_blind_annotation_packet.py
      - scripts/freeze_machine_predictions.py
      - src/mdmeta/benchmark.py
      - src/mdmeta/protocol_events.py
      - tests/test_query_europe_pmc.py
      - tests/test_fulltext_screen.py
      - tests/test_screened_plan_workpack.py
      - tests/test_blind_annotation_packet.py
      - tests/test_prediction_freeze.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Lint provisional-corpus code
        run: >-
          ruff check
          scripts/prepare_confirmatory_benchmark.py
          scripts/query_europe_pmc.py
          scripts/screen_selected_fulltext.py
          scripts/finalize_screened_plan.py
          scripts/build_annotation_workpack.py
          scripts/build_blind_annotation_packet.py
          scripts/freeze_machine_predictions.py
          src/mdmeta/benchmark.py
          src/mdmeta/protocol_events.py
      - name: Run offline provisional-corpus tests
        run: >-
          pytest -q
          tests/test_query_europe_pmc.py
          tests/test_fulltext_screen.py
          tests/test_screened_plan_workpack.py
          tests/test_blind_annotation_packet.py
          tests/test_prediction_freeze.py

  prepare-and-screen:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Query historical biomolecular Europe PMC metadata
        env:
          MAX_CANDIDATES: ${{ inputs.max_candidates || '500' }}
        run: |
          mkdir -p study/confirmatory_60/generated/temporal
          python scripts/query_europe_pmc.py \
            --output study/confirmatory_60/generated/temporal/historical_candidates.json \
            --max-candidates "$MAX_CANDIDATES" \
            --query 'OPEN_ACCESS:Y AND HAS_FT:Y AND FIRST_PDATE:[2016-01-01 TO 2020-12-31] AND (TITLE_ABS:"molecular dynamics" OR TITLE_ABS:"MD simulation") AND (TITLE_ABS:protein OR TITLE_ABS:enzyme OR TITLE_ABS:receptor OR TITLE_ABS:ligand OR TITLE_ABS:peptide OR TITLE_ABS:membrane OR TITLE_ABS:DNA OR TITLE_ABS:RNA OR TITLE_ABS:biomolecular)'
      - name: Create deterministic oversampled screening pool
        env:
          SEED: ${{ inputs.seed || '3997' }}
          SCREENING_POOL_SIZE: ${{ inputs.screening_pool_size || '90' }}
        run: |
          python scripts/prepare_confirmatory_benchmark.py \
            --candidates study/confirmatory_60/generated/temporal/historical_candidates.json \
            --excluded-ids study/confirmatory_60/prior_article_ids.txt \
            --minimum-excluded 0 \
            --publication-year-min 2016 \
            --publication-year-max 2020 \
            --require-known-year \
            --study-status provisional_temporal_isolation \
            --seed "$SEED" \
            --development-size "$SCREENING_POOL_SIZE" \
            --validation-size 0 \
            --locked-test-size 0 \
            --output study/confirmatory_60/generated/temporal/provisional_screening_pool.json
      - name: Machine-screen selected full text and retain an ephemeral runner snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/mdmeta-jats-cache"
          python scripts/screen_selected_fulltext.py \
            --plan study/confirmatory_60/generated/temporal/provisional_screening_pool.json \
            --output study/confirmatory_60/generated/temporal/fulltext_machine_screen.json \
            --xml-cache-dir "$RUNNER_TEMP/mdmeta-jats-cache"
      - name: Finalize the first 60 machine-eligible articles
        run: |
          python scripts/finalize_screened_plan.py \
            --pool-plan study/confirmatory_60/generated/temporal/provisional_screening_pool.json \
            --screen study/confirmatory_60/generated/temporal/fulltext_machine_screen.json \
            --output study/confirmatory_60/generated/temporal/provisional_temporal_plan.json
      - name: Build independent eligibility-review and annotation workpack
        run: |
          python scripts/build_annotation_workpack.py \
            --plan study/confirmatory_60/generated/temporal/provisional_temporal_plan.json \
            --screen study/confirmatory_60/generated/temporal/fulltext_machine_screen.json \
            --output-dir study/confirmatory_60/generated/temporal/workpack
      - name: Build blinded AI reading packet without machine predictions
        run: |
          mkdir -p study/confirmatory_60/generated/temporal/blind_ai_packet
          python scripts/build_blind_annotation_packet.py \
            --plan study/confirmatory_60/generated/temporal/provisional_temporal_plan.json \
            --screen study/confirmatory_60/generated/temporal/fulltext_machine_screen.json \
            --xml-cache-dir "$RUNNER_TEMP/mdmeta-jats-cache" \
            --output study/confirmatory_60/generated/temporal/blind_ai_packet/articles.json
      - name: Freeze deterministic predictions from the same source snapshots
        run: |
          mkdir -p study/confirmatory_60/generated/temporal/predictions
          set +e
          python scripts/freeze_machine_predictions.py \
            --plan study/confirmatory_60/generated/temporal/provisional_temporal_plan.json \
            --screen study/confirmatory_60/generated/temporal/fulltext_machine_screen.json \
            --xml-cache-dir "$RUNNER_TEMP/mdmeta-jats-cache" \
            --output study/confirmatory_60/generated/temporal/predictions/machine_predictions.json \
            > study/confirmatory_60/generated/temporal/predictions/run.log 2>&1
          status=$?
          echo "$status" > study/confirmatory_60/generated/temporal/predictions/exit_code.txt
          cat study/confirmatory_60/generated/temporal/predictions/run.log
          exit "$status"
      - name: Delete ephemeral full-text snapshots
        if: always()
        run: rm -rf "$RUNNER_TEMP/mdmeta-jats-cache"
      - name: Write separate checksums
        if: always()
        run: |
          cd study/confirmatory_60/generated/temporal
          sha256sum historical_candidates.json provisional_screening_pool.json fulltext_machine_screen.json provisional_temporal_plan.json > CORPUS_SHA256SUMS.txt || true
          find workpack -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > workpack/SHA256SUMS.txt || true
          find blind_ai_packet -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > blind_ai_packet/SHA256SUMS.txt || true
          find predictions -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > predictions/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: provisional-temporal-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            study/confirmatory_60/generated/temporal/historical_candidates.json
            study/confirmatory_60/generated/temporal/provisional_screening_pool.json
            study/confirmatory_60/generated/temporal/fulltext_machine_screen.json
            study/confirmatory_60/generated/temporal/provisional_temporal_plan.json
            study/confirmatory_60/generated/temporal/CORPUS_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: provisional-temporal-human-workpack-${{ github.run_id }}-${{ github.run_attempt }}
          path: study/confirmatory_60/generated/temporal/workpack/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: provisional-temporal-blind-ai-packet-${{ github.run_id }}-${{ github.run_attempt }}
          path: study/confirmatory_60/generated/temporal/blind_ai_packet/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: provisional-temporal-machine-predictions-${{ github.run_id }}-${{ github.run_attempt }}
          path: study/confirmatory_60/generated/temporal/predictions/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
