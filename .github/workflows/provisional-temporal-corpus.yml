name: Build provisional temporal corpus

on:
  workflow_dispatch:
    inputs:
      max_candidates:
        description: Maximum historical Europe PMC candidates
        required: false
        default: "500"
      seed:
        description: Deterministic split seed
        required: false
        default: "3997"
  pull_request:
    paths:
      - study/confirmatory_60/RUN_PROVISIONAL_TEMPORAL

permissions:
  contents: read

jobs:
  prepare-and-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Query historical Europe PMC metadata
        env:
          MAX_CANDIDATES: ${{ inputs.max_candidates || '500' }}
        run: |
          mkdir -p study/confirmatory_60/generated/temporal
          python scripts/query_europe_pmc.py \
            --output study/confirmatory_60/generated/temporal/historical_candidates.json \
            --max-candidates "$MAX_CANDIDATES" \
            --query 'OPEN_ACCESS:Y AND HAS_FT:Y AND FIRST_PDATE:[2016-01-01 TO 2020-12-31] AND (TITLE_ABS:"molecular dynamics" OR TITLE_ABS:"MD simulation")'
      - name: Create provisional temporal 30/10/20 plan
        env:
          SEED: ${{ inputs.seed || '3997' }}
        run: |
          python scripts/prepare_confirmatory_benchmark.py \
            --candidates study/confirmatory_60/generated/temporal/historical_candidates.json \
            --excluded-ids study/confirmatory_60/prior_article_ids.txt \
            --minimum-excluded 0 \
            --publication-year-min 2016 \
            --publication-year-max 2020 \
            --require-known-year \
            --study-status provisional_temporal_isolation \
            --seed "$SEED" \
            --output study/confirmatory_60/generated/temporal/provisional_temporal_plan.json
      - name: Machine-screen selected full text without storing XML
        run: |
          python scripts/screen_selected_fulltext.py \
            --plan study/confirmatory_60/generated/temporal/provisional_temporal_plan.json \
            --output study/confirmatory_60/generated/temporal/fulltext_machine_screen.json
      - name: Write artifact checksums
        if: always()
        run: |
          cd study/confirmatory_60/generated/temporal
          sha256sum *.json > SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provisional-temporal-corpus
          path: study/confirmatory_60/generated/temporal/
          retention-days: 90
