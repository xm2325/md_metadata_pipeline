name: Prepare provisional temporally isolated corpus

on:
  push:
    branches:
      - provisional-temporal-corpus
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Query historical biomolecular MD metadata
        run: |
          python scripts/query_europe_pmc.py \
            --query 'OPEN_ACCESS:Y AND HAS_FT:Y AND PUB_YEAR:[2016 TO 2020] AND (TITLE_ABS:"molecular dynamics" OR TITLE_ABS:"MD simulation") AND (TITLE_ABS:protein OR TITLE_ABS:enzyme OR TITLE_ABS:receptor OR TITLE_ABS:ligand OR TITLE_ABS:peptide OR TITLE_ABS:membrane OR TITLE_ABS:DNA OR TITLE_ABS:RNA OR TITLE_ABS:biomolecular)' \
            --output study/confirmatory_60/generated/historical_candidates.json \
            --max-candidates 500
      - name: Create deterministic 90-article screening pool
        run: |
          python scripts/prepare_confirmatory_benchmark.py \
            --candidates study/confirmatory_60/generated/historical_candidates.json \
            --excluded-ids study/confirmatory_60/prior_article_ids.txt \
            --study-status provisional_temporal_isolation \
            --publication-year-min 2016 \
            --publication-year-max 2020 \
            --require-known-year \
            --development-size 90 \
            --validation-size 0 \
            --locked-test-size 0 \
            --output study/confirmatory_60/generated/provisional_screening_pool.json
      - name: Screen selected biomolecular full text without storing XML
        run: |
          python scripts/screen_selected_fulltext.py \
            --plan study/confirmatory_60/generated/provisional_screening_pool.json \
            --output study/confirmatory_60/generated/fulltext_screen.json
      - name: Finalize 60 machine-screened articles
        run: |
          python scripts/finalize_screened_plan.py \
            --pool-plan study/confirmatory_60/generated/provisional_screening_pool.json \
            --screen study/confirmatory_60/generated/fulltext_screen.json \
            --output study/confirmatory_60/generated/provisional_temporal_plan.json
      - name: Build independent human-review and annotation workpack
        run: |
          python scripts/build_annotation_workpack.py \
            --plan study/confirmatory_60/generated/provisional_temporal_plan.json \
            --screen study/confirmatory_60/generated/fulltext_screen.json \
            --output-dir study/confirmatory_60/generated/workpack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provisional-temporal-corpus
          path: study/confirmatory_60/generated/
          retention-days: 30
