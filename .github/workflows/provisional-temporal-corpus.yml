name: Prepare provisional temporally isolated corpus

on:
  push:
    branches:
      - provisional-temporal-corpus
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Query historical Europe PMC metadata
        run: |
          python scripts/query_europe_pmc.py \
            --query 'OPEN_ACCESS:Y AND HAS_FT:Y AND PUB_YEAR:[2016 TO 2020] AND (TITLE_ABS:"molecular dynamics" OR TITLE_ABS:"MD simulation")' \
            --output study/confirmatory_60/generated/historical_candidates.json \
            --max-candidates 500
      - name: Create provisional 30/10/20 plan
        run: |
          python scripts/prepare_confirmatory_benchmark.py \
            --candidates study/confirmatory_60/generated/historical_candidates.json \
            --excluded-ids study/confirmatory_60/prior_article_ids.txt \
            --study-status provisional_temporal_isolation \
            --publication-year-min 2016 \
            --publication-year-max 2020 \
            --require-known-year \
            --output study/confirmatory_60/generated/provisional_temporal_plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provisional-temporal-corpus
          path: study/confirmatory_60/generated/
          retention-days: 30
