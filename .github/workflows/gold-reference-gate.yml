name: Validate gold reference gate

on:
  pull_request:
    paths:
      - .github/workflows/gold-reference-gate.yml
      - scripts/gold_reference_gate.py
      - src/mdmeta/annotation.py
      - src/mdmeta/gold_reference.py
      - tests/test_annotation.py
      - tests/test_gold_reference.py
      - docs/ANNOTATION_GUIDE.md
      - study/independent_100/README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  synthetic-offline-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Lint the human-reference boundary
        run: >-
          ruff check
          scripts/gold_reference_gate.py
          src/mdmeta/annotation.py
          src/mdmeta/gold_reference.py
          tests/test_annotation.py
          tests/test_gold_reference.py
      - name: Validate only synthetic labels
        run: pytest -q tests/test_annotation.py tests/test_gold_reference.py
