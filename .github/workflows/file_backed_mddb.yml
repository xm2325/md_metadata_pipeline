name: File-backed MDDB mapping

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/file_backed_mddb.yml
      - pyproject.toml
      - src/mdmeta/file_backed.py
      - src/mdmeta/file_consistency.py
      - src/mdmeta/validation.py
      - scripts/run_file_backed_mddb_case.py
      - tests/test_file_backed.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  offline-file-mapping-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/mdmeta/file_backed.py src/mdmeta/file_consistency.py scripts/run_file_backed_mddb_case.py tests/test_file_backed.py
      - run: pytest tests/test_file_backed.py

  live-file-backed-case:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: offline-file-mapping-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,files]'
      - name: Run public PSF PDB XTC and residue mapping audit
        id: audit
        run: |
          mkdir -p results/file_backed
          set +e
          python scripts/run_file_backed_mddb_case.py \
            --manifest examples/mddb_mcv1900193_2/project_manifest.json \
            --work-dir results/file_backed/assets \
            --output results/file_backed/report.json \
            --mapping-output results/file_backed/residue_mapping.jsonl \
            --cache-dir results/file_backed/cache \
            2>&1 | tee results/file_backed/run.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compact report mapping and diagnostics when storage is available
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: file-backed-mddb-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/file_backed/report.json
            results/file_backed/residue_mapping.jsonl
            results/file_backed/atom_identity_diagnostics.json
            results/file_backed/run.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Enforce live file-backed acceptance gate
        if: always()
        run: test "${{ steps.audit.outputs.status }}" = "0"
