name: Server readiness

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/server-readiness.yml
      - .github/workflows/container-release.yml
      - constraints/**
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - pyproject.toml
      - schemas/**
      - scripts/check_runtime_lock.py
      - src/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/build.txt
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/build.txt
            constraints/runtime.txt
            constraints/security.txt
      - name: Install quality, API, and packaging dependencies
        run: |
          python scripts/check_runtime_lock.py
          python -m pip install --constraint constraints/runtime.txt -e '.[dev,api]'
          python -m pip install -r constraints/build.txt -r constraints/security.txt
      - name: Build and inspect the wheel
        run: |
          mkdir -p reports
          python -m build
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install \
            --constraint constraints/runtime.txt \
            --force-reinstall \
            "${wheel}[api]"
          python scripts/check_runtime_lock.py --check-installed
          python -m pip check
          python - <<'PY'
          import json
          import tomllib
          from importlib.metadata import version
          from importlib.metadata import entry_points
          from pathlib import Path
          from mdmeta.server import ServerSettings

          expected_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version("md-metadata-pipeline") == expected_version
          expected_scripts = {
              "mdmeta-export-contracts",
              "mdmeta-recovery",
              "mdmeta-release",
              "mdmeta-serve",
              "mdmeta-verify-database",
          }
          installed_scripts = {
              entry.name for entry in entry_points(group="console_scripts")
          }
          assert expected_scripts <= installed_scripts
          settings = ServerSettings.from_env()
          print(json.dumps({"version": version("md-metadata-pipeline"), "settings": str(settings)}))
          PY
          mdmeta-export-contracts --help
          mdmeta-recovery --help
          mdmeta-release --help
          mdmeta-verify-database --help
      - name: Verify committed public contract schemas
        run: mdmeta-export-contracts --output-dir schemas --check
      - name: Test installed wheel server and integrity paths
        run: |
          pytest \
            tests/test_contracts.py \
            tests/test_server.py \
            tests/test_integration.py \
            tests/test_recovery.py \
            tests/test_release.py \
            tests/test_runtime_lock.py \
            tests/test_validation.py \
            --junitxml=reports/pytest-wheel.xml
      - name: Dependency vulnerability report
        id: dependency_audit
        run: >-
          python -m pip_audit
          --strict
          --progress-spinner off
          --requirement constraints/runtime.txt
          --format json
          --output reports/pip-audit.json
      - name: Upload test, audit, and package evidence
        id: quality_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: server-readiness-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Report evidence persistence state
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.quality_artifact.outcome }}
        run: |
          {
            echo "## Python readiness evidence"
            echo "- dependency audit: ${AUDIT_OUTCOME}"
            echo "- artifact upload: ${ARTIFACT_OUTCOME}"
            if [ "${ARTIFACT_OUTCOME}" != "success" ]; then
              echo "- WARNING: tests ran, but their persistent artifact was not stored."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build API image with GitHub Actions layer cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: mdmeta:ci
          cache-from: type=gha,scope=mdmeta-api
          cache-to: type=gha,mode=max,scope=mdmeta-api
      - name: Run hardened container smoke test
        run: |
          mkdir -p reports
          docker volume create mdmeta-ci-data
          docker run --name mdmeta-snapshot \
            --volume mdmeta-ci-data:/data \
            --env MDMETA_DATABASE_READ_ONLY=false \
            mdmeta:ci \
            python -c 'from mdmeta.storage import SQLiteRecordStore; store = SQLiteRecordStore("/data/records.sqlite"); report = store.integrity_report(); assert report["integrity"] == ["ok"] and report["foreign_key_violations"] == [] and report["schema_version"] == 1; store.checkpoint()'
          docker cp mdmeta-snapshot:/data/records.sqlite reports/records.sqlite
          docker rm mdmeta-snapshot
          docker volume rm mdmeta-ci-data
          test ! -s reports/records.sqlite-wal
          dataset_sha=$(sha256sum reports/records.sqlite | cut -d ' ' -f 1)
          docker run --detach --name mdmeta-api \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --volume "$PWD/reports/records.sqlite:/data/records.sqlite:ro" \
            --env MDMETA_ENV=production \
            --env MDMETA_DATABASE_READ_ONLY=true \
            --env MDMETA_DATASET_SHA256="$dataset_sha" \
            --env MDMETA_BUILD_SHA="${{ github.sha }}" \
            --env MDMETA_ALLOWED_HOSTS=127.0.0.1 \
            --env MDMETA_ENABLE_DOCS=false \
            --env MDMETA_PROXY_HEADERS=false \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --publish 127.0.0.1:8000:8000 \
            mdmeta:ci
          for attempt in $(seq 1 30); do
            if curl --disable --noproxy '*' --fail --silent \
              --output reports/readyz.json \
              http://127.0.0.1:8000/readyz; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker logs mdmeta-api
              exit 1
            fi
            sleep 1
          done
          api_base=http://127.0.0.1:8000
          curl --disable --noproxy '*' --fail --silent \
            --output reports/metadata.json \
            "$api_base/metadata"
          curl --disable --noproxy '*' --fail --silent \
            --output reports/openapi.json \
            "$api_base/openapi.json"
          curl --disable --noproxy '*' --fail --silent --get \
            --data-urlencode 'pdb_id=6VSB' \
            --output reports/search.json \
            "$api_base/search"
          curl --disable --noproxy '*' --fail --silent \
            --dump-header reports/metrics.headers \
            --output reports/metrics.prom \
            "$api_base/metrics"
          curl --disable --noproxy '*' --silent \
            --header 'X-Request-ID: smoke-docs-404' \
            --dump-header reports/docs.headers \
            --output reports/docs.json \
            --write-out '%{http_code}\n' \
            "$api_base/docs" > reports/docs.status
          curl --disable --noproxy '*' --silent \
            --header 'Host: attacker.example' \
            --header 'X-Request-ID: smoke-invalid-host-400' \
            --dump-header reports/invalid-host.headers \
            --output reports/invalid-host.json \
            --write-out '%{http_code}\n' \
            "$api_base/livez" > reports/invalid-host.status
          docker exec mdmeta-api python -c 'import os; assert os.getuid() == 10001'
          if docker exec mdmeta-api sh -c 'touch /app/write-probe'; then
            echo "container root filesystem is writable" >&2
            exit 1
          fi
          if docker exec mdmeta-api sh -c 'touch /data/write-probe'; then
            echo "dataset mount is writable" >&2
            exit 1
          fi
          EXPECTED_DATASET_SHA="$dataset_sha" EXPECTED_BUILD_SHA="${{ github.sha }}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          def read_headers(path: str) -> dict[str, str]:
              headers = {}
              for raw_line in Path(path).read_bytes().splitlines():
                  if b":" not in raw_line:
                      continue
                  raw_name, raw_value = raw_line.split(b":", 1)
                  headers[raw_name.decode("latin-1").casefold()] = raw_value.decode(
                      "latin-1"
                  ).strip()
              return headers

          def assert_security_headers(
              headers: dict[str, str], expected_request_id: str | None = None
          ) -> None:
              request_id = headers["x-request-id"]
              if expected_request_id is None:
                  assert len(request_id) == 32
                  int(request_id, 16)
              else:
                  assert request_id == expected_request_id
              assert headers["x-content-type-options"] == "nosniff"
              assert headers["x-frame-options"] == "DENY"
              assert headers["referrer-policy"] == "no-referrer"
              assert headers["permissions-policy"] == (
                  "accelerometer=(), camera=(), geolocation=(), microphone=()"
              )
              assert headers["content-security-policy"] == (
                  "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
              )

          metadata = json.loads(Path("reports/metadata.json").read_text())
          readiness = json.loads(Path("reports/readyz.json").read_text())
          search = json.loads(Path("reports/search.json").read_text())
          docs_problem = json.loads(Path("reports/docs.json").read_text())
          invalid_host_problem = json.loads(Path("reports/invalid-host.json").read_text())
          docs_headers = read_headers("reports/docs.headers")
          invalid_host_headers = read_headers("reports/invalid-host.headers")
          metrics_headers = read_headers("reports/metrics.headers")
          metrics = Path("reports/metrics.prom").read_text()
          assert metadata["database_mode"] == "read_only"
          assert metadata["database_schema_version"] == 1
          assert metadata["dataset_sha256"] == os.environ["EXPECTED_DATASET_SHA"]
          assert metadata["build_sha"] == os.environ["EXPECTED_BUILD_SHA"]
          assert readiness["status"] == "ready"
          assert readiness["database_schema_version"] == 1
          assert search == {"count": 0, "records": []}
          assert Path("reports/docs.status").read_text().strip() == "404"
          assert docs_headers["content-type"].startswith("application/problem+json")
          assert docs_problem["status"] == 404
          assert docs_problem["code"] == "http-404"
          assert docs_problem["instance"] == "/docs"
          assert docs_problem["request_id"] == "smoke-docs-404"
          assert_security_headers(docs_headers, "smoke-docs-404")
          assert Path("reports/invalid-host.status").read_text().strip() == "400"
          assert invalid_host_headers["content-type"].startswith(
              "application/problem+json"
          )
          assert invalid_host_problem["status"] == 400
          assert invalid_host_problem["code"] == "invalid-host"
          assert invalid_host_problem["request_id"] == "smoke-invalid-host-400"
          assert_security_headers(invalid_host_headers, "smoke-invalid-host-400")
          assert metrics_headers["content-type"].startswith("text/plain")
          assert_security_headers(metrics_headers)
          assert "mdmeta_build_info" in metrics
          assert "mdmeta_dataset_articles 0.0" in metrics
          PY
          docker image inspect mdmeta:ci > reports/image-inspect.json
          docker stop --time 35 mdmeta-api > reports/docker-stop.txt
          docker inspect --format '{{.State.ExitCode}}' mdmeta-api \
            > reports/container-exit-code.txt
          test "$(tr -d '\r\n' < reports/container-exit-code.txt)" = "0"
      - name: Capture logs and tolerate cleanup failures
        if: always()
        run: |
          mkdir -p reports
          docker logs mdmeta-api > reports/container.log 2>&1 || true
          docker rm --force mdmeta-api || true
          docker rm --force mdmeta-snapshot || true
          docker volume rm mdmeta-ci-data || true
      - name: Upload container evidence
        id: container_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: server-readiness-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Report container evidence persistence state
        if: always()
        env:
          ARTIFACT_OUTCOME: ${{ steps.container_artifact.outcome }}
        run: |
          {
            echo "## Container readiness evidence"
            echo "- artifact upload: ${ARTIFACT_OUTCOME}"
            if [ "${ARTIFACT_OUTCOME}" != "success" ]; then
              echo "- WARNING: the smoke test ran, but its persistent artifact was not stored."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  actions-storage-inventory:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Summarize repository artifact and cache use without creating an artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {owner, repo, per_page: 100},
            );
            let caches = null;
            try {
              caches = await github.paginate(
                "GET /repos/{owner}/{repo}/actions/caches",
                {owner, repo, per_page: 100},
              );
            } catch (error) {
              core.warning(`Cache inventory unavailable: ${error.message}`);
            }
            const bytes = (rows) => rows.reduce(
              (total, row) => total + Number(row.size_in_bytes || 0),
              0,
            );
            const mib = (value) => (value / 1024 / 1024).toFixed(2);
            const liveArtifacts = artifacts.filter((item) => !item.expired);
            const largest = [...liveArtifacts]
              .sort((a, b) => b.size_in_bytes - a.size_in_bytes)
              .slice(0, 10)
              .map((item) => [
                item.name,
                `${mib(item.size_in_bytes)} MiB`,
                item.expires_at || "unknown",
              ]);
            core.summary
              .addHeading("GitHub Actions storage inventory")
              .addTable([
                [{data: "Category", header: true}, {data: "Count", header: true}, {data: "Size", header: true}],
                ["Live artifacts", String(liveArtifacts.length), `${mib(bytes(liveArtifacts))} MiB`],
                [
                  "Caches",
                  caches === null ? "N/A" : String(caches.length),
                  caches === null ? "N/A" : `${mib(bytes(caches))} MiB`,
                ],
              ]);
            if (largest.length) {
              core.summary.addHeading("Largest live artifacts", 3).addTable([
                [{data: "Name", header: true}, {data: "Size", header: true}, {data: "Expires", header: true}],
                ...largest,
              ]);
            }
            core.summary.addRaw(
              "This inventory covers only this repository. Account-level artifact/Packages usage, " +
              "other repositories and logs are not included. Artifacts are evidence bundles; caches " +
              "are reserved for dependencies and Docker layers. This report intentionally creates no artifact."
            );
            await core.summary.write();
