[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-metadata-pipeline"
version = "0.11.0"
description = "Evidence-linked molecular-dynamics literature and file metadata integration"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "prometheus-client>=0.25,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
api = ["uvicorn>=0.30,<1"]
files = ["MDAnalysis>=2.8,<3"]

[project.scripts]
mdmeta-export-contracts = "mdmeta.contracts:main"
mdmeta-recovery = "mdmeta.recovery:main"
mdmeta-release = "mdmeta.release:main"
mdmeta-serve = "mdmeta.server:main"
mdmeta-verify-database = "mdmeta.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
