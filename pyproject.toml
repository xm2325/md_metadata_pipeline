[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-metadata-pipeline"
version = "0.2.0"
description = "Phase-aware MD literature metadata extraction and PDBe/UniProt/SIFTS validation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Wenhua Zhou"}]
dependencies = [
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "build>=1,<2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
mdlit = "mdlit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -m 'not live'"
testpaths = ["tests"]
markers = ["live: requires network access"]

[tool.coverage.run]
source = ["mdlit"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/mdlit/cli.py" = ["B008"]
